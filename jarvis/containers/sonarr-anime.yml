services:
  sonarr-anime:
    container_name: sonarr-anime
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - TZ=Asia/Kolkata
      - PUID=1000
      - PGID=1000
      - SONARR_CHANNEL=v4-stable
      - SONARR_BRANCH=main
    ports:
      - "8990:8989"
    volumes:
      - /opt/arrstack/sonarr-anime:/config
      - /opt/media:/data
    restart: unless-stopped

# Note: Root folder inside container should be set to /data/anime,
# and Jellyseerr must connect to this service using the container
# name "sonarr-anime" with the INTERNAL port 8989 (not the host port 8990).
